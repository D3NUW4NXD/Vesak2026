<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VESAK 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+Sinhala:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#FFD700;--deep-gold:#C8860A;--saffron:#FF8C00;
  --maroon:#6B0000;--cream:#FFF8E7;--deep-blue:#060618;
  --lotus:#FF6B9D;--jade:#00C87A;--sky:#0d1340;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--deep-blue);font-family:'Cinzel Decorative',serif;overflow-x:hidden;min-height:100vh;width:100vw;cursor:default;padding-bottom:60px;transition:background 0.8s ease;}

/* STARS */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity 0.8s ease;}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out infinite alternate;}
@keyframes tw{from{opacity:.1;transform:scale(.7);}to{opacity:1;transform:scale(1.3);}}

/* FLOATING PARTICLES */
#particles{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden;}
.petal{position:absolute;font-size:16px;animation:petalFall var(--pd) linear infinite;opacity:0;}
@keyframes petalFall{
  0%{transform:translateY(-40px) rotate(0deg) translateX(0);opacity:0;}
  10%{opacity:.8;}
  90%{opacity:.5;}
  100%{transform:translateY(110vh) rotate(720deg) translateX(var(--px));opacity:0;}
}

/* STAGE WRAPPER */
#app{position:relative;z-index:10;width:100vw;min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}

/* STAGE transitions */
.stage{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;opacity:0;transform:scale(.94) translateY(20px);transition:opacity 0.5s ease, transform 0.5s ease;}
.stage.active{display:flex;position:relative;opacity:1;pointer-events:all;transform:scale(1) translateY(0);}
.stage.exit{opacity:0;transform:scale(1.05) translateY(-20px);}

/* PROGRESS BAR */
#progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--saffron),var(--gold));z-index:100;transition:width .6s ease;box-shadow:0 0 12px var(--gold);}
#stage-dots{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:100;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,215,0,.25);border:1px solid rgba(255,215,0,.4);transition:all .4s;}
.dot.done{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.dot.current{background:var(--saffron);box-shadow:0 0 12px var(--saffron);transform:scale(1.3);}

/* NEXT BUTTON */
.next-btn{
  margin-top:20px;padding:12px 32px;
  background:linear-gradient(135deg,var(--maroon),#8B0000);
  border:2px solid var(--gold);border-radius:50px;
  color:var(--gold);font-family:'Cinzel Decorative',serif;font-size:12px;letter-spacing:2px;
  cursor:pointer;transition:all .3s;box-shadow:0 0 20px rgba(255,140,0,.3);
  position:relative;overflow:hidden;width:100%;max-width:280px;text-align:center;
}
.next-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,215,0,.15),transparent);opacity:0;transition:.3s;}
.next-btn:hover::before{opacity:1;}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(255,140,0,.5);}
.next-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}

/* GOLD DIVIDER */
.gdiv{display:flex;align-items:center;gap:10px;margin:8px 0;width:100%;max-width:320px;}
.gdiv span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

/* STAGE TITLE */
.stage-num{font-size:10px;color:var(--saffron);letter-spacing:3px;opacity:.7;margin-bottom:4px;text-align:center;}
.stage-title{font-size:clamp(16px,4.5vw,24px);color:var(--gold);text-shadow:0 0 15px var(--saffron);text-align:center;margin-bottom:4px;}
.stage-sinhala{font-family:'Noto Serif Sinhala',serif;font-size:clamp(12px,3.5vw,16px);color:rgba(255,248,231,.7);text-align:center;margin-bottom:12px;}

/* ===== STAGE 1 – GIANT LANTERN ===== */
.lantern-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;}
.giant-lantern-wrap{position:relative;width:180px;height:240px;margin:10px auto;display:flex;justify-content:center;}
.giant-lantern{
  width:160px;height:220px;
  border-radius:50% 50% 42% 42%;
  position:relative;
  animation:lanternSpin 6s ease-in-out infinite, lanternGlow 2s ease-in-out infinite alternate;
  cursor:pointer;
  box-shadow:0 0 40px 15px rgba(255,180,0,.4),inset -15px -15px 30px rgba(0,0,0,.3);
}
@keyframes lanternSpin{
  0%{transform:rotate(-6deg);}25%{transform:rotate(6deg);}50%{transform:rotate(-4deg);}75%{transform:rotate(5deg);}100%{transform:rotate(-6deg);}
}
@keyframes lanternGlow{
  from{box-shadow:0 0 40px 10px rgba(255,100,0,.4),0 0 80px 20px rgba(255,200,0,.2);}
  to{box-shadow:0 0 60px 20px rgba(255,180,0,.7),0 0 110px 40px rgba(255,220,0,.3);}
}
.lantern-top{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:70px;height:18px;background:linear-gradient(to right,#8B0000,#C00,#8B0000);border-radius:4px;border:2px solid var(--gold);z-index:2;}
.lantern-string{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:2px;height:30px;background:var(--gold);z-index:1;}
.lantern-bottom{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:50px;height:12px;background:linear-gradient(to right,#8B0000,#C00,#8B0000);border-radius:2px;border:1px solid var(--gold);}
.lantern-fringe-row{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);display:flex;gap:3px;}
.lantern-fringe-row span{display:block;width:2px;height:16px;border-radius:2px;background:var(--gold);opacity:.8;animation:fringeWave 1.5s ease-in-out infinite alternate;}
.lantern-fringe-row span:nth-child(odd){animation-delay:.2s;}
@keyframes fringeWave{from{transform:scaleY(1);}to{transform:scaleY(.7);}}
.lantern-inner-pattern{position:absolute;inset:15px;border-radius:50% 50% 40% 40%;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:44px;}
.lantern-shine{position:absolute;top:15px;left:15px;width:30px;height:60px;background:rgba(255,255,255,.12);border-radius:50%;transform:rotate(-20deg);}
.lantern-desc{width:100%;max-width:340px;text-align:center;background:rgba(107,0,0,.3);border:1px solid rgba(255,215,0,.25);border-radius:12px;padding:12px 16px;margin-top:10px;}
.lantern-desc p{font-family:'Noto Serif Sinhala',serif;color:var(--cream);font-size:11px;line-height:1.6;opacity:.85;}

/* ===== STAGE 2 – OIL LAMPS ===== */
.lamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:340px;margin:10px 0;justify-items:center;}
.oil-lamp{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s;width:100%;}
.oil-lamp:hover{transform:scale(1.05);}
.lamp-flame{width:12px;height:22px;background:radial-gradient(ellipse at 50% 80%,#fff 0%,var(--gold) 40%,var(--saffron) 70%,transparent 100%);border-radius:50% 50% 20% 20%;opacity:0;transition:opacity .5s;animation:flicker 1.2s ease-in-out infinite alternate;box-shadow:0 0 8px 3px rgba(255,200,0,.4);margin-bottom:-3px;}
.oil-lamp.lit .lamp-flame{opacity:1;}
@keyframes flicker{from{transform:scaleX(1) rotate(-2deg);}to{transform:scaleX(.9) rotate(2deg);}}
.lamp-body{width:42px;height:22px;background:linear-gradient(to bottom,#B8860B,#DAA520,#B8860B);border-radius:0 0 50% 50%;border:1.5px solid var(--deep-gold);position:relative;}
.lamp-base{width:50px;height:8px;background:linear-gradient(to right,#8B6914,#DAA520,#8B6914);border-radius:4px;border:1px solid var(--deep-gold);}
.lamp-stem{width:6px;height:12px;background:linear-gradient(to right,#8B6914,#DAA520,#8B6914);margin:0 auto;}
.lamp-plate{width:56px;height:6px;background:linear-gradient(to right,#8B6914,#DAA520,#8B6914);border-radius:4px;border:1px solid var(--deep-gold);}
.lamp-grid .lamp-wick{width:2px;height:6px;background:#333;position:absolute;top:-4px;left:50%;transform:translateX(-50%)}
.lamps-progress{font-family:'Noto Serif Sinhala',serif;color:var(--gold);font-size:12px;margin:6px 0;letter-spacing:1px;text-align:center;}

/* ===== STAGE 3 – VESAK LANTERNS ===== */
.lanterns-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:12px;width:100%;max-width:340px;margin:12px auto;justify-content:center;}
.vesak-lantern-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;transition:transform .3s;}
.vesak-lantern-item:hover{transform:scale(1.05);}
.v-string{width:1px;height:20px;background:var(--gold);}
.v-top{width:30px;height:8px;background:var(--maroon);border:1px solid var(--gold);border-radius:2px;}
.v-body{
  width:60px;height:75px;border-radius:40% 40% 35% 35%;
  position:relative;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,215,0,0.3);
  transition:all 0.6s ease;
  box-shadow:inset -5px -5px 10px rgba(0,0,0,0.5);
}
.vesak-lantern-item.lit .v-body{
  animation:lanternSpin 5s ease-in-out infinite alternate;
}
.vesak-lantern-item.lit[data-color="blue"] .v-body { background: radial-gradient(circle at 35% 35%, #4da6ff, #0052cc, #002266); box-shadow: 0 0 25px #0052cc; border-color: #4da6ff; }
.vesak-lantern-item.lit[data-color="yellow"] .v-body { background: radial-gradient(circle at 35% 35%, #fff5cc, #ffcc00, #997a00); box-shadow: 0 0 25px #ffcc00; border-color: #fff5cc; }
.vesak-lantern-item.lit[data-color="red"] .v-body { background: radial-gradient(circle at 35% 35%, #ff6666, #cc0000, #660000); box-shadow: 0 0 25px #cc0000; border-color: #ff6666; }
.vesak-lantern-item.lit[data-color="white"] .v-body { background: radial-gradient(circle at 35% 35%, #ffffff, #e6f2ff, #99bcde); box-shadow: 0 0 25px #ffffff; border-color: #ffffff; }
.vesak-lantern-item.lit[data-color="orange"] .v-body { background: radial-gradient(circle at 35% 35%, #ffb366, #ff6600, #993d00); box-shadow: 0 0 25px #ff6600; border-color: #ffb366; }

.v-body::after{content:'☸';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,0.2);transition:color 0.4s;}
.vesak-lantern-item.lit .v-body::after{color:rgba(255,255,255,0.7);text-shadow:0 0 8px #fff;}
.v-bottom{width:24px;height:6px;background:var(--maroon);border-radius:1px;border:1px solid var(--gold);}
.v-fringes{display:flex;gap:2px;margin-top:2px;}
.v-fringes span{width:1px;height:12px;background:var(--gold);opacity:0.6;}
.lantern-label{font-size:9px;color:rgba(255,248,231,0.6);margin-top:6px;text-transform:uppercase;letter-spacing:1px;}
.vesak-lantern-item.lit .lantern-label{color:var(--gold);font-weight:bold;}

/* ===== STAGE 4 – DANSALA INTERACTIVE ===== */
.dansala-scene{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:340px;}
.dansala-counter{
  width:100%;background:linear-gradient(135deg,rgba(107,0,0,.4),rgba(30,10,0,.5));
  border:2px solid var(--gold);border-radius:12px;padding:12px;
  position:relative;overflow:hidden;
}
.dansala-counter::before{content:'🏮 ශ්‍රී ලංකා දාන සාලය 🏮';position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:'Noto Serif Sinhala',serif;font-size:9px;color:rgba(255,215,0,.5);white-space:nowrap;letter-spacing:1px;}
.dc-shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px;}
.food-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);
  border-radius:8px;padding:6px 2px;cursor:pointer;
  transition:all .2s;text-align:center;
}
.food-item:hover{background:rgba(255,215,0,.15);transform:translateY(-2px);}
.food-item.given{opacity:.3;pointer-events:none;}
.food-item.selected{border-color:var(--jade);background:rgba(0,200,120,.15);transform:scale(1.04);}
.food-emoji{font-size:24px;}
.food-item.selected .food-emoji { animation: flicker 0.5s infinite alternate; }
.food-name{font-family:'Noto Serif Sinhala',serif;font-size:9px;color:var(--cream);white-space:nowrap;}
.food-stock{font-size:8px;color:rgba(255,215,0,.6);font-family:'Noto Serif Sinhala',serif;}

.queue-label{font-family:'Noto Serif Sinhala',serif;font-size:10px;color:rgba(255,215,0,.6);letter-spacing:1px;margin-top:4px;}
.visitor-queue{
  display:flex;gap:8px;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.25);border:1px solid rgba(255,215,0,.15);border-radius:10px;padding:8px;width:100%;min-height:64px;
}
.visitor-bubble{display:none;flex-direction:column;align-items:center;gap:2px;transition:all .4s;}
.visitor-bubble.current{display:flex;}
.visitor-face{font-size:32px;animation:bounce .6s ease infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-6px);}}
.visitor-speech{font-size:10px;font-family:'Noto Serif Sinhala',serif;color:var(--jade);text-align:center;min-height:14px;font-weight:bold;}
.merit-panel{
  display:flex;gap:12px;align-items:center;justify-content:center;
  background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);border-radius:50px;padding:6px 20px;margin-top:4px;
}
.merit-count{font-size:16px;color:var(--gold);letter-spacing:1px;text-shadow:0 0 10px var(--gold);}
.dansala-msg{font-family:'Noto Serif Sinhala',serif;color:var(--jade);font-size:11px;min-height:16px;text-align:center;margin-top:2px;}

/* ===== STAGE 5 – GEETHA AUDIO MUSIC PLAYER CONSOLE ===== */
.geetha-player-card {
  width: 100%;
  max-width: 360px;
  background: linear-gradient(145deg, #110822, #070311);
  border: 2px solid var(--gold);
  border-radius: 20px;
  padding: 20px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(255,215,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.player-display-window {
  width: 100%;
  background: #020107;
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.now-playing-tag {
  font-size: 8px;
  color: var(--saffron);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.current-song-title {
  font-family: 'Noto Serif Sinhala', serif;
  color: var(--gold);
  font-size: 14px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(255,215,0,0.4);
  min-height: 20px;
}
.current-song-lyrics {
  font-family: 'Noto Serif Sinhala', serif;
  color: var(--cream);
  font-size: 11px;
  opacity: 0.8;
  margin-top: 6px;
  min-height: 32px;
  line-height: 1.5;
}
.player-visualizer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: 20px;
  margin-top: 8px;
}
.vis-string {
  width: 3px; height: 3px;
  background: var(--gold);
  border-radius: 50%;
  transition: transform 0.1s ease;
}
.player-visualizer.active .vis-string {
  animation: audioPulse 0.5s ease-in-out infinite alternate;
}
@keyframes audioPulse { from { transform: scaleY(1); height: 3px; } to { transform: scaleY(5); height: 16px; } }
.vis-string:nth-child(even) { animation-delay: 0.1s; }
.vis-string:nth-child(3n) { animation-delay: 0.2s; }
.vis-string:nth-child(4n) { animation-delay: 0.3s; }

.songs-playlist-container {
  width: 100%;
  max-height: 150px;
  overflow-y: auto;
  margin-bottom: 16px;
  padding-right: 4px;
}
.songs-playlist-container::-webkit-scrollbar { width: 4px; }
.songs-playlist-container::-webkit-scrollbar-thumb { background: var(--maroon); border-radius: 4px; }

/* Enhanced target playlist item track rows styling */
.playlist-track-row {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,215,0,0.1);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.2s ease;
}
.playlist-track-row:hover { background: rgba(255,215,0,0.06); }
.playlist-track-row.playing-now {
  background: rgba(107,0,0,0.3);
  border-color: var(--gold);
}
.track-left-info { display: flex; align-items: center; gap: 8px; }
.track-num-circle {
  width: 18px; height: 18px;
  background: rgba(255,215,0,0.1);
  border-radius: 50%;
  font-size: 9px; color: var(--gold);
  display: flex; align-items: center; justify-content: center;
}
.playlist-track-row.playing-now .track-num-circle { background: var(--gold); color: var(--maroon); font-weight: bold; }
.track-label-si { font-family: 'Noto Serif Sinhala', serif; font-size: 11px; color: var(--cream); }
.playlist-track-row.playing-now .track-label-si { color: var(--gold); font-weight: 600; }
.track-status-badge { font-size: 10px; color: rgba(255,215,0,0.4); }
.playlist-track-row.playing-now .track-status-badge { color: var(--jade); animation: flicker 0.8s infinite alternate; }

.player-hardware-controls {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 8px;
}
.hw-circ-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: linear-gradient(135deg, #300, var(--maroon));
  border: 2px solid var(--gold);
  color: var(--gold);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.hw-circ-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--saffron); }
.hw-circ-btn:active { transform: scale(0.95); }
.hw-circ-btn.play-toggle-btn { width: 54px; height: 54px; font-size: 18px; background: linear-gradient(135deg, #8B0000, #CC0000); }

/* ===== STAGE 6 – BORDERLESS THEATER MODE ===== */
.video-stage-container {
  width: 100vw;
  max-width: 800px;
  margin: 0 auto;
  padding: 0;
  background: transparent;
  border: none;
  box-shadow: none;
}
.video-wrapper-16-9 {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background-color: #000;
  position: relative;
  z-index: 5;
}
.video-wrapper-16-9 video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.video-desc {
  text-align: center;
  margin-top: 20px;
  padding: 0 16px;
}
.video-desc p {
  font-family: 'Noto Serif Sinhala', serif;
  color: var(--cream);
  font-size: 13px;
  line-height: 1.6;
  opacity: 0.85;
}

/* FINAL BLESSING */
.blessing{text-align:center;padding:12px;background:radial-gradient(ellipse,rgba(255,140,0,.1) 0%,transparent 70%);width:100%;max-width:340px;}
.blessing p{font-family:'Noto Serif Sinhala',serif;color:var(--cream);font-size:12px;line-height:1.8;opacity:.85;margin-bottom:8px;}
.blessing .big{font-size:26px;animation:bGlow 2s ease-in-out infinite alternate;display:block;margin-top:10px;}
@keyframes bGlow{from{text-shadow:0 0 10px var(--gold);}to{text-shadow:0 0 25px var(--saffron),0 0 45px var(--gold);}}

/* ===== STICKY FOOTER NAVIGATION ===== */
#site-footer{
  position:fixed;bottom:0;left:0;width:100vw;height:54px;
  background:linear-gradient(to top, rgba(4,4,16,0.95), rgba(6,6,24,0.85));
  backdrop-filter:blur(10px);border-top:1px solid rgba(255,215,0,0.2);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:2000;
}
.footer-nav-link{
  color:rgba(255,248,231,0.7);font-size:11px;text-decoration:none;
  letter-spacing:1.5px;transition:all 0.3s ease;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.footer-nav-link:hover, .footer-nav-link.active{
  color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,0.5);
}
.footer-audio-control{background:none;border:none;color:var(--gold);font-size:16px;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;}


/* =======================================================
   CINEMATIC TV PRODUCTION CREDITS END SCREEN DESIGN 
======================================================= */
#thanks-page {
  display: none; 
  width: 100vw;
  height: calc(100vh - 54px);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;

<script>
/* ───────────────────────────────────────────────
   BACKGROUND MUSIC SYSTEM (MP3 STREAM WRAPPER)
─────────────────────────────────────────────── */
const BGM = (function(){
  let audioStream, ctx, gainNode, isMuted = false, started = false;

  function initAudioNode() {
    if (audioStream) return;
    
    audioStream = new Audio();
    audioStream.src = "vesak_theme.mp3"; 
    audioStream.loop = true;
    audioStream.preload = "auto";
    
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = ctx.createGain();
      const source = ctx.createMediaElementSource(audioStream);
      gainNode.gain.setValueAtTime(0, ctx.currentTime);
      source.connect(gainNode);
      gainNode.connect(ctx.destination);
    } catch(e) {
      console.log("Web Audio Graph binding error fallback:", e);
    }
  }

  function start() {
    initAudioNode();
    if (started) {
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return;
    }
    
    started = true;
    audioStream.play().then(() => {
      if (gainNode && ctx) {
        gainNode.gain.cancelScheduledValues(ctx.currentTime);
        gainNode.gain.setValueAtTime(0, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(isMuted ? 0 : 0.1, ctx.currentTime + 0.5);
      } else {
        audioStream.volume = isMuted ? 0 : 0.3;
      }
    }).catch(err => {
      started = false; 
      console.log("Audio playback deferred until next user click event profile handler.");
    });
  }

  function fadeOutForFinal() {
    if (!audioStream) return;
    if (gainNode && ctx) {
      gainNode.gain.cancelScheduledValues(ctx.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, ctx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
      setTimeout(() => { if(!window.isGeethaPlaying) audioStream.pause(); }, 1500);
    } else {
      audioStream.pause();
    }
  }

  function fadeBackIn() {
    if (!audioStream || isMuted || window.isGeethaPlaying) return;
    initAudioNode();
    audioStream.play().then(() => {
      if (gainNode && ctx) {
        gainNode.gain.cancelScheduledValues(ctx.currentTime);
        gainNode.gain.setValueAtTime(gainNode.gain.value, ctx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 1.5);
      } else {
        audioStream.volume = 0.6;
      }
    });
  }

  function toggleMute() {
    initAudioNode();
    isMuted = !isMuted;
    
    if (!started) {
      start();
      document.querySelector('#global-mute-btn .mute-icon').textContent = '🔊';
      return;
    }

    if (gainNode && ctx) {
      gainNode.gain.cancelScheduledValues(ctx.currentTime);
      gainNode.gain.setValueAtTime(gainNode.gain.value, ctx.currentTime);
      gainNode.gain.linearRampToValueAtTime(isMuted ? 0 : 0.6, ctx.currentTime + 0.3);
    } else {
      audioStream.volume = isMuted ? 0 : 0.6;
    }
    
    if (window.geethaAudioInstance) {
      window.geethaAudioInstance.muted = isMuted;
    }
    
    document.querySelector('#global-mute-btn .mute-icon').textContent = isMuted ? '🔇' : '🔊';
  }

  return {start, fadeOutForFinal, fadeBackIn, toggleMute};
})();

document.getElementById('global-mute-btn').addEventListener('click',function(e){
  e.preventDefault();

});

function routeTo(view) {
  const homeLink = document.getElementById('nav-home');
  const thanksLink = document.getElementById('nav-thanks');
  const appContainer = document.getElementById('app');
  const thanksContainer = document.getElementById('thanks-page');
  const dotsContainer = document.getElementById('stage-dots');
  const progressBar = document.getElementById('progress-bar');

  document.body.style.background = "var(--deep-blue)";
  document.getElementById('stars').style.opacity = '1';

  if (view === 'thanks') {
    homeLink.classList.remove('active');
    thanksLink.classList.add('active');
    appContainer.style.display = 'none';
    
    thanksContainer.classList.add('tv-active-view');
    
    dotsContainer.style.opacity = '0';
    progressBar.style.opacity = '0';
    
    if (window.geethaAudioInstance) {
      window.geethaAudioInstance.pause();
    }
    
    triggerFireworks();
  } else {
    thanksLink.classList.remove('active');
    homeLink.classList.add('active');
    
    thanksContainer.classList.remove('tv-active-view');
    
    appContainer.style.display = 'flex';
    dotsContainer.style.opacity = '1';
    progressBar.style.opacity = '1';
    
    if (current < 3) {
      BGM.fadeBackIn();
    }
  }
}

/* ───────────────────────────────────────────────
   STAGE ENGINE
─────────────────────────────────────────────── */
let current=0;
const stageEls=[];

function buildDots(){
  const d=document.getElementById('stage-dots'); d.innerHTML='';
  for(let i=0;i<TOTAL_STAGES;i++){
    const el=document.createElement('div'); el.className='dot'; el.id='dot'+i; d.appendChild(el);
  }
}
function updateDots(){
  for(let i=0;i<TOTAL_STAGES;i++){
    const el=document.getElementById('dot'+i);
    if(el) el.className='dot'+(i<current?' done':i===current?' current':'');
  }
  document.getElementById('progress-bar').style.width=((current+1)/TOTAL_STAGES*100)+'%';
}
function goNext() {
  BGM.start();
  if(current < TOTAL_STAGES - 1) {
    stageEls[current].classList.remove('active'); 
    stageEls[current].classList.add('exit');
    
    if (window.geethaAudioInstance) {
      window.geethaAudioInstance.pause();
    }
    
    const dynamicVideo = document.getElementById('thoranaVideoPlayer');
    if(dynamicVideo) {
      dynamicVideo.pause();
    }

    current++;
    stageEls[current].classList.add('active');
    updateDots();
    onStageEnter(current);
  }
}
function nextBtn(label='NEXT VIEW →'){
  const b=document.createElement('button'); b.className='next-btn'; b.textContent=label;
  b.onclick=goNext; return b;
}

    row.innerHTML = `
      <div class="track-left-info">
        <div class="track-num-circle">${idx + 1}</div>
        <div class="track-label-si">${track.title.split(' (')[0]}</div>
      </div>
      <div class="track-status-badge">READY</div>
    `;
    row.onclick = () => selectAndPlayTrack(idx);
    playlistContainer.appendChild(row);
  });

  const hardwareControls = document.createElement('div');
  hardwareControls.className = 'player-hardware-controls';

  const prevBtnEl = document.createElement('button');
  prevBtnEl.className = 'hw-circ-btn'; prevBtnEl.innerHTML = '⏮';
  prevBtnEl.onclick = () => { if(window.currentTrackIndex > 0) selectAndPlayTrack(window.currentTrackIndex - 1); };

  const playBtnEl = document.createElement('button');
  playBtnEl.className = 'hw-circ-btn play-toggle-btn';
  playBtnEl.id = 'geetha-master-play-btn'; playBtnEl.innerHTML = '▶';
  playBtnEl.onclick = () => toggleGeethaPlayback();

  const nextBtnEl = document.createElement('button');
  nextBtnEl.className = 'hw-circ-btn'; nextBtnEl.innerHTML = '⏭';
  nextBtnEl.onclick = () => { if(window.currentTrackIndex < PLAYLIST_DATA.length - 1) selectAndPlayTrack(window.currentTrackIndex + 1); };

  hardwareControls.appendChild(prevBtnEl);
  hardwareControls.appendChild(playBtnEl);
  hardwareControls.appendChild(nextBtnEl);

  playerCard.appendChild(displayWindow);
  playerCard.appendChild(playlistContainer);
  playerCard.appendChild(hardwareControls);

  s.appendChild(playerCard);
  s.appendChild(nextBtn('VIEW SACRED THORANA VIDEO →'));
  return s;
}

/* ───────────────────────────────────────────────
   GEETHA STREAM CONTROLLERS (NATIVE AUDIO ENGINE)
─────────────────────────────────────────────── */
function selectAndPlayTrack(idx) {
  if (window.BGM) window.BGM.fadeOutForFinal();

  if (window.geethaAudioInstance) {
    window.geethaAudioInstance.pause();
    window.geethaAudioInstance.currentTime = 0;
  }

  window.currentTrackIndex = idx;
  window.isGeethaPlaying = true;
  
  document.querySelectorAll('.playlist-track-row').forEach(row => {
    row.classList.remove('playing-now');
    row.querySelector('.track-status-badge').textContent = 'READY';
  });
  const activeRow = document.getElementById(`track-row-${idx}`);
  if(activeRow) {
    activeRow.classList.add('playing-now');
    activeRow.querySelector('.track-status-badge').textContent = 'PLAYING';
  }

  document.getElementById('geetha-status-tag').textContent = 'Now Playing';
  document.getElementById('geetha-title-view').textContent = PLAYLIST_DATA[idx].title;
  document.getElementById('geetha-lyrics-view').textContent = PLAYLIST_DATA[idx].lyric;
  document.getElementById('geetha-master-play-btn').innerHTML = '⏸';
  document.getElementById('geetha-visualizer-bars').classList.add('active');

  window.geethaAudioInstance = new Audio(PLAYLIST_DATA[idx].file);
  window.geethaAudioInstance.volume = 0.8;
  
  const globalMuteIcon = document.querySelector('#global-mute-btn .mute-icon');
  if (globalMuteIcon && globalMuteIcon.textContent === '🔇') {
    window.geethaAudioInstance.muted = true;
  }

  window.geethaAudioInstance.play().catch(err => {
    console.log("Audio pipeline requires direct click action profiles authorizations.", err);
    document.getElementById('geetha-status-tag').textContent = 'Deferred';
  });

  window.geethaAudioInstance.onended = () => {
    if (window.currentTrackIndex < PLAYLIST_DATA.length - 1) {
      selectAndPlayTrack(window.currentTrackIndex + 1);
    } else {
      window.isGeethaPlaying = false;
      document.getElementById('geetha-master-play-btn').innerHTML = '▶';
      document.getElementById('geetha-visualizer-bars').classList.remove('active');
      document.getElementById('geetha-status-tag').textContent = 'Finished';
    }
  };
}

function toggleGeethaPlayback() {
  if (window.currentTrackIndex === -1) {
    selectAndPlayTrack(0);
    return;
  }
  
  const playBtn = document.getElementById('geetha-master-play-btn');
  const viz = document.getElementById('geetha-visualizer-bars');
  const statusTag = document.getElementById('geetha-status-tag');

  if (!window.geethaAudioInstance) return;

  if (window.geethaAudioInstance.paused) {
    window.geethaAudioInstance.play().catch(e => console.log(e));
    window.isGeethaPlaying = true;
    playBtn.innerHTML = '⏸';
    viz.classList.add('active');
    statusTag.textContent = 'Now Playing';
    if (window.BGM) window.BGM.fadeOutForFinal();
  } else {
    window.geethaAudioInstance.pause();
    window.isGeethaPlaying = false;
    playBtn.innerHTML = '▶';
    viz.classList.remove('active');
    statusTag.textContent = 'Paused';
  }
}

function showSadhuToast(txt){
  const t=document.createElement('div'); t.className='sadhu-toast'; t.textContent=txt;
  document.body.appendChild(t); setTimeout(()=>t.remove(),800);
}

function onStageEnter(stg){
  if(stg === 3){
    let points = parseInt(document.getElementById('mCount')?.textContent || 0);
    setTimeout(() => { if(points === 0) showSadhuToast('🏮 Welcome to Dansala!'); }, 400);
    BGM.fadeOutForFinal();
  }
  
  if(stg === 4){
    showSadhuToast('🎵 Bakthi Geetha Deck Online');
    BGM.fadeOutForFinal();
  }
  
  if(stg === 5){
    document.body.style.background = "#000000";
    document.getElementById('stars').style.opacity = '0';
    BGM.fadeOutForFinal();

    const videoObj = document.getElementById('thoranaVideoPlayer');
    if (videoObj) {
      videoObj.currentTime = 0;
      videoObj.play().catch(e => console.log("Autoplay blocked. Handle video playback manually."));
    }
  } else if (stg < 3) {
    document.body.style.background = "var(--deep-blue)";
    document.getElementById('stars').style.opacity = '1';
    BGM.fadeBackIn();
  }
}

/* FIREWORKS EFFECT FOR THANK YOU PAGE */
function triggerFireworks(){
  const c=document.createElement('div'); c.className='thanks-firework'; document.body.appendChild(c);
  for(let i=0; i<3; i++){
    setTimeout(()=>{
      const sx=Math.random()*80+10, sy=Math.random()*60+10;
      const clrs=['#FFD700','#FF8C00','#FF6B9D','#00C87A','#FF3333'];
      const rc=clrs[Math.floor(Math.random()*clrs.length)];
      for(let j=0; j<24; j++){
        const d=document.createElement('div'); d.className='fw-dot';
        d.style.background=rc; d.style.left=sx+'%'; d.style.top=sy+'%';
        const angle=Math.random()*Math.PI*2, dist=Math.random()*80+40;
        d.style.setProperty('--fx',Math.cos(angle)*dist+'px');
        d.style.setProperty('--fy',Math.sin(angle)*dist+'px');
        d.style.setProperty('--fd',(0.6+Math.random()*0.6)+'s');
        c.appendChild(d);
      }
    }, i*400);
  }
  setTimeout(()=>c.remove(), 2500);
}
